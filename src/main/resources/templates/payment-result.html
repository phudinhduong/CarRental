<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kết quả thanh toán VNPAY</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card p-4 shadow">
        <h3 class="mb-3 text-center">Kết quả thanh toán</h3>
        <p class="text-center" th:text="${message}"></p>
        <hr>
        <h5>Thông tin giao dịch:</h5>
        <table class="table table-bordered">
            <tr><th>Mã giao dịch</th><td th:text="${params['vnp_TxnRef']}"></td></tr>
            <tr><th>Số tiền</th><td th:text="${params['vnp_Amount']}"></td></tr>
            <tr><th>Mã phản hồi</th><td th:text="${params['vnp_ResponseCode']}"></td></tr>
            <tr><th>Trạng thái</th><td th:text="${params['vnp_TransactionStatus']}"></td></tr>
        </table>
        <div class="text-center">
            <a href="/" class="btn btn-primary">Về trang chủ</a>
        </div>
    </div>
</div>
</body>
</html>
