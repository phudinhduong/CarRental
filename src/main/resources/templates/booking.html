<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>ROYAL CARS - Car Rental HTML Template</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Free HTML Templates" name="keywords">
    <meta content="Free HTML Templates" name="description">

    <!-- Favicon -->
    <link rel="icon" th:href="@{/img/favicon.ico}">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rubik&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.0/css/all.min.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link rel="stylesheet" th:href="@{/lib/owlcarousel/assets/owl.carousel.min.css}">
    <link rel="stylesheet" th:href="@{/lib/tempusdominus/css/tempusdominus-bootstrap-4.min.css}">

    <!-- Customized Bootstrap Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

    <!-- Template Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>


<body>
<!-- Import topbar -->
<div th:replace="fragments/header :: topbar"></div>

<!-- Import navbar (active = home) -->
<div th:replace="fragments/header :: navbar('home')"></div>

<!-- Page Header Start -->
<div class="container-fluid page-header">
    <h1 class="display-3 text-uppercase text-white mb-3">Car Booking</h1>
    <div class="d-inline-flex text-white">
        <h6 class="text-uppercase m-0"><a class="text-white" href="">Home</a></h6>
        <h6 class="text-body m-0 px-3">/</h6>
        <h6 class="text-uppercase text-body m-0">Car Booking</h6>
    </div>
</div>
<!-- Page Header Start -->


<!-- Detail Start -->
<div class="container-fluid pt-5">
    <div class="container pt-5 pb-3">
        <!-- Tên xe -->
        <h1 class="display-4 text-uppercase mb-5" th:text="${vehicle.title}">Tên xe</h1>
        <div class="row align-items-center pb-2">
            <div class="col-lg-6 mb-4" th:with="imgs=${images}">
                <!-- Có ảnh -->
                <div th:if="${imgs != null and imgs.size() > 0}">
                    <img class="img-fluid" th:src="@{${imgs.get(0).url}}" alt="Vehicle image">
                </div>
            </div>
            <div class="col-lg-6 mb-4">
                <!-- Giá thuê -->
                <h4 class="mb-2" th:text="'' + ${#numbers.formatDecimal(vehicle.dailyPrice, 0, 'COMMA', 0, 'POINT')} + 'đ/Day'">
                </h4>
                <div class="d-flex mb-3">
                    <h6 class="mr-2">Brand:</h6>
                    <p th:text=" ${vehicle.brand}"></p>
                </div>

                <!-- Location ngay dưới Brand -->
                <p th:if="${vehicle.location != null}">
                    <i class="fa fa-map-marker-alt text-primary mr-2"></i>
                    <span th:text="${vehicle.location.addressLine}">Address line</span>
                    <span th:if="${vehicle.location.city != null}" th:text="', ' + ${vehicle.location.city}">, City</span>
                </p>

                <!-- Owner -->
                <p th:if="${vehicle.owner != null}">
                    <i class="fa fa-user text-primary mr-2"></i>
                    <span th:text="'Owner: ' + ${vehicle.owner.fullName != null ? vehicle.owner.fullName : vehicle.owner.email}">
                Owner: ...
          </span>
                </p>

                <div class="d-flex pt-1">
                    <h6>Share on:</h6>
                    <div class="d-inline-flex">
                        <a class="px-2" href=""><i class="fab fa-facebook-f"></i></a>
                        <a class="px-2" href=""><i class="fab fa-twitter"></i></a>
                        <a class="px-2" href=""><i class="fab fa-linkedin-in"></i></a>
                        <a class="px-2" href=""><i class="fab fa-pinterest"></i></a>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-n3 mt-lg-0 pb-4">
            <div class="col-md-3 col-6 mb-2">
                <i class="fa fa-car text-primary mr-2"></i>
                <span th:text="'Year: ' + ${vehicle.year}"></span>
            </div>
            <div class="col-md-3 col-6 mb-2">
                <i class="fa fa-palette text-primary mr-2"></i>
                <span th:text="'Color: ' + ${vehicle.color}"></span>
            </div>
            <div class="col-md-3 col-6 mb-2">
                <i class="fa fa-chair text-primary mr-2"></i>
                <span th:text="'Seat: ' + ${vehicle.seats}"></span>
            </div>
            <div class="col-md-3 col-6 mb-2">
                <i class="fa fa-car-side text-primary mr-2"></i>
                <span th:text="'Model: ' + ${vehicle.model}"></span>
            </div>
        </div>
    </div>
</div>
<!-- Detail End -->

<!-- Car Booking Start -->
<div class="container-fluid pb-5">
    <div class="container">
        <div class="row">
            <form id="bookingForm" th:action="@{/booking/confirm}" method="post">
                <input type="hidden" name="vehicleId" th:value="${vehicle.vehicleId}" />
                <input type="hidden" id="dailyPrice" th:value="${vehicle.dailyPrice}" />
                <!-- Pickup & Dropoff Location -->
                <div class="row">
                    <div class="col-6 form-group">
                        <label for="pickupLocation">Pickup Location</label>
                        <select id="pickupLocation" name="pickupLocationId" class="custom-select px-4" required>
                            <option value="" disabled selected>Choose pickup location</option>
                            <option th:each="loc : ${locations}" th:value="${loc.locationId}" th:text="${loc.addressLine}"></option>
                        </select>
                    </div>
                    <div class="col-6 form-group">
                        <label for="dropoffLocation">Dropoff Location</label>
                        <select id="dropoffLocation" name="dropoffLocationId" class="custom-select px-4" required>
                            <option value="" disabled selected>Choose dropoff location</option>
                            <option th:each="loc : ${locations}" th:value="${loc.locationId}" th:text="${loc.addressLine}"></option>
                        </select>
                    </div>
                </div>
                <!-- Start & End DateTime -->
                <div class="row">
                    <div class="col-6 form-group">
                        <label for="startDatetime">Start Date & Time</label>
                        <input type="datetime-local" id="startDatetime" name="startDatetime" class="form-control px-4" required />
                    </div>
                    <div class="col-6 form-group">
                        <label for="endDatetime">End Date & Time</label>
                        <input type="datetime-local" id="endDatetime" name="endDatetime" class="form-control px-4" required />
                    </div>
                </div>
                <!-- Display rental days and total price -->
                <div class="form-group">
                    <p><strong>Rental Days:</strong> <span id="rentalDays">0</span></p>
                    <p><strong>Total Price:</strong> <span id="totalPrice">0</span> đ</p>
                </div>
                <button class="btn btn-block btn-primary py-3" type="submit">Book Now</button>
            </form>
        </div>
    </div>
</div>
<!-- Car Booking End -->

<script>
    // 🕒 Lấy các phần tử cần dùng
    const startInput = document.getElementById('startDatetime');
    const endInput = document.getElementById('endDatetime');
    const rentalDaysEl = document.getElementById('rentalDays');
    const totalPriceEl = document.getElementById('totalPrice');
    const dailyPrice = parseFloat(document.getElementById('dailyPrice').value);

    // 🧭 Khi load trang, đặt min cho ngày bắt đầu = thời điểm hiện tại
    window.addEventListener('load', function () {
        const now = new Date();
        const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
            .toISOString()
            .slice(0, 16); // yyyy-MM-ddTHH:mm
        startInput.min = local;
        endInput.min = local;
    });

    // ⚙️ Hàm tính toán số ngày thuê và tổng tiền
    function calculateRental() {
        const start = new Date(startInput.value);
        const end = new Date(endInput.value);

        if (start && end && end > start) {
            const diffMs = end - start;
            const hours = diffMs / (1000 * 60 * 60);
            const days = Math.ceil(hours / 24);
            const total = days * dailyPrice;

            rentalDaysEl.textContent = days;
            totalPriceEl.textContent = total.toLocaleString('vi-VN');
        } else {
            rentalDaysEl.textContent = '0';
            totalPriceEl.textContent = '0';
        }
    }

    // 📅 Tự động tính lại khi người dùng thay đổi thời gian
    startInput.addEventListener('change', calculateRental);
    endInput.addEventListener('change', calculateRental);

    // ✅ Kiểm tra hợp lệ trước khi submit form
    document.getElementById('bookingForm').addEventListener('submit', function (e) {
        const start = new Date(startInput.value);
        const end = new Date(endInput.value);
        const now = new Date();
        now.setSeconds(0, 0); // Xóa mili giây để so sánh chính xác hơn

        if (!startInput.value || !endInput.value) {
            e.preventDefault();
            alert('Vui lòng chọn đầy đủ ngày bắt đầu và ngày kết thúc!');
            return;
        }

        if (start < now) {
            e.preventDefault();
            alert('Ngày bắt đầu không được ở trong quá khứ!');
            return;
        }

        if (end <= start) {
            e.preventDefault();
            alert('Ngày kết thúc phải sau ngày bắt đầu!');
            return;
        }

        // Nếu hợp lệ => cho submit
        calculateRental(); // Tính lại cho chắc
    });
</script>

<a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="fa fa-angle-double-up"></i></a>
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/lib/easing/easing.min.js}"></script>
<script th:src="@{/lib/waypoints/waypoints.min.js}"></script>
<script th:src="@{/lib/owlcarousel/owl.carousel.min.js}"></script>
<script th:src="@{/lib/tempusdominus/js/moment.min.js}"></script>
<script th:src="@{/lib/tempusdominus/js/moment-timezone.min.js}"></script>
<script th:src="@{/lib/tempusdominus/js/tempusdominus-bootstrap-4.min.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>

</html>
